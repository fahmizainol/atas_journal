  document.getElementById('meta').innerHTML =
    `<b>${D.symbol}</b> · ${D.start_label}→${D.end_label} · <b>${W}-minute</b> windows matched against <b>${D.bank.toLocaleString()}</b> windows from <b>${D.pool}</b> days — any day, <b>any time of day</b> · N=<b>${D.n}</b> per query, one per day · what followed = next <b>${F} min</b>`;
  document.getElementById('note').innerHTML =
    `<b>How to read it.</b> Left: this day's session with the current ${W}-minute window shaded. Right: that window's matches overlaid — each drawn in ticks from its own opening price, so only shape is compared — with what followed each, past the divider.
     Below: every match as its own cell, captioned with the day and <b>the time of day it happened</b>, which is the point: a 10:15 move can match a 14:40 one.
     Toggle to <span style="color:#a0a0aa">control</span> for the same number of random windows. With ${D.bank.toLocaleString()} windows in the bank <i>something</i> will always look similar, so the only question that means anything is whether the matches' continuations agree more than the random ones' do — the numbers under the overlay say whether they do.`;

  const scrub = document.getElementById('scrub');
  scrub.max = D.positions.length - 1;

  function fit(c, h) { const r = c.getBoundingClientRect(); const dpr = devicePixelRatio || 1;
    c.width = Math.round(r.width * dpr); c.height = Math.round(h * dpr);
    const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); return [g, r.width, h]; }
  const pct = (a, p) => { const s = [...a].sort((x, y) => x - y); const i = (s.length - 1) * p / 100;
    const lo = Math.floor(i), hi = Math.ceil(i); return s[lo] + (s[hi] - s[lo]) * (i - lo); };
  const hhmm = i => { const m = (18 * 60 + D.start + i) % 1440; return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; };

  // The target day's session, with the query window shaded.
  function drawMain() {
    const [g, Wd, Hh] = fit(document.getElementById('main'), 330);
    g.clearRect(0, 0, Wd, Hh);
    const padL = 4, padR = 52, padT = 6, padB = 16;
    const S = D.session, vals = [];
    for (const k of ['close', 'v', 'u', 'l', 'poc', 'vah', 'val']) for (const x of S[k]) if (x != null) vals.push(x);
    let lo = Math.min(...vals), hi = Math.max(...vals); const pd = (hi - lo) * .06 || 1; lo -= pd; hi += pd;
    const X = i => padL + i / (N - 1) * (Wd - padL - padR), Y = p => padT + (hi - p) / (hi - lo) * (Hh - padT - padB);
    const s0 = P().s - D.start;
    g.fillStyle = 'rgba(108,92,231,0.16)'; g.fillRect(X(s0), padT, X(s0 + W) - X(s0), Hh - padT - padB);
    g.strokeStyle = 'rgba(108,92,231,0.7)'; g.lineWidth = 1;
    g.strokeRect(X(s0), padT, X(s0 + W) - X(s0), Hh - padT - padB);
    g.fillStyle = '#8a8f9c'; g.font = '10px system-ui'; g.textAlign = 'center';
    for (let i = 0; i < N; i += 60) g.fillText(hhmm(i), X(i), Hh - 4);
    g.textAlign = 'left'; const step = Math.max(5, Math.round((hi - lo) / 6 / 5) * 5);
    for (let p = Math.ceil(lo / step) * step; p < hi; p += step) { g.strokeStyle = '#232733'; g.beginPath(); g.moveTo(padL, Y(p)); g.lineTo(Wd - padR, Y(p)); g.stroke(); g.fillText(p.toFixed(0), Wd - padR + 4, Y(p) + 3); }
    const line = (k, col, w = 1, alpha = 1, dash = []) => { g.strokeStyle = col; g.lineWidth = w; g.globalAlpha = alpha; g.setLineDash(dash); g.beginPath(); let on = false;
      for (let i = 0; i < N; i++) { const v = S[k][i]; if (v == null) { on = false; continue; } if (!on) { g.moveTo(X(i), Y(v)); on = true; } else g.lineTo(X(i), Y(v)); }
      g.stroke(); g.globalAlpha = 1; g.setLineDash([]); };
    line('vah', '#e0a52a', 1, .5, [4, 3]); line('val', '#e0a52a', 1, .5, [4, 3]); line('poc', '#e0a52a', 1.2, .85);
    line('u', '#5b4fb0', 1, .8); line('l', '#5b4fb0', 1, .8); line('v', '#8b7cf6', 1.2);
    line('close', '#e6e8ee', 1.3);
  }

  // One window + continuation, in ticks off its own open.
  function drawWin(c, h, it, opts) {
    const [g, Wd, Hh] = fit(c, h);
    g.clearRect(0, 0, Wd, Hh);
    const padL = 3, padR = 3, padT = 5, padB = 5, L = it.c.length;
    const vals = [];
    for (const k of ['c', 'v', 'u', 'l']) for (const x of it[k]) if (x != null) vals.push(x);
    let lo = Math.min(...vals), hi = Math.max(...vals); const pd = (hi - lo) * .07 || 1; lo -= pd; hi += pd;
    const X = i => padL + i / (L - 1) * (Wd - padL - padR), Y = t => padT + (hi - t) / (hi - lo) * (Hh - padT - padB);
    g.strokeStyle = '#2a2e38'; g.setLineDash([3, 3]); g.beginPath(); g.moveTo(X(W - 1), padT); g.lineTo(X(W - 1), Hh - padB); g.stroke(); g.setLineDash([]);
    const line = (k, col, from, to, w = 1, alpha = 1) => { g.strokeStyle = col; g.lineWidth = w; g.globalAlpha = alpha; g.beginPath(); let on = false;
      for (let i = from; i < to; i++) { const v = it[k][i]; if (v == null) { on = false; continue; } if (!on) { g.moveTo(X(i), Y(v)); on = true; } else g.lineTo(X(i), Y(v)); }
      g.stroke(); g.globalAlpha = 1; };
    line('u', '#5b4fb0', 0, W, 1, .55); line('l', '#5b4fb0', 0, W, 1, .55); line('v', '#8b7cf6', 0, W, 1.1, .9);
    line('close', '#e6e8ee', 0, 0); line('c', '#e6e8ee', 0, W, 1.3);
    line('c', opts.col, W - 1, L, 1.3);
  }

  // All matches overlaid, aligned at the window's start.
  function drawFan() {
    const [g, Wd, Hh] = fit(document.getElementById('fan'), 330);
    g.clearRect(0, 0, Wd, Hh);
    const padL = 40, padR = 8, padT = 16, padB = 16;
    const items = showSet === 'm' ? P().m : P().ctl, L = W + F;
    const all = [];
    for (const it of items) for (const v of it.c) if (v != null) all.push(v);
    if (reveal) for (const v of P().self.c) if (v != null) all.push(v);
    let ext = Math.max(Math.abs(Math.min(...all)), Math.abs(Math.max(...all))) * 1.05 || 10;
    const X = i => padL + i / (L - 1) * (Wd - padL - padR), Y = t => padT + (ext - t) / (2 * ext) * (Hh - padT - padB);
    g.strokeStyle = '#2a2e38'; g.beginPath(); g.moveTo(padL, Y(0)); g.lineTo(Wd - padR, Y(0)); g.stroke();
    g.setLineDash([3, 3]); g.beginPath(); g.moveTo(X(W - 1), padT); g.lineTo(X(W - 1), Hh - padB); g.stroke(); g.setLineDash([]);
    g.fillStyle = '#8a8f9c'; g.font = '10px system-ui'; g.textAlign = 'right';
    for (const t of [-ext * .7, 0, ext * .7]) g.fillText(`${t >= 0 ? '+' : ''}${Math.round(t)}t`, padL - 4, Y(t) + 3);
    g.textAlign = 'center'; g.fillText('window', X(W / 2), Hh - 3);
    for (const m of [30, 60]) if (m <= F) g.fillText(`+${m}m`, X(W - 1 + m), Hh - 3);
    g.textAlign = 'left';
    const col = showSet === 'm' ? 'rgba(196,181,253,' : 'rgba(160,160,170,';
    for (const it of items) {
      g.lineWidth = 1; g.beginPath(); let on = false;
      for (let i = 0; i < L; i++) { const v = it.c[i]; if (v == null) { on = false; continue; }
        g.strokeStyle = col + (i < W ? '0.75)' : '0.4)');
        if (!on) { g.moveTo(X(i), Y(v)); on = true; } else { g.lineTo(X(i), Y(v)); g.stroke(); g.beginPath(); g.moveTo(X(i), Y(v)); } }
      g.stroke();
    }
    // median of what followed
    if (items.length >= 4) {
      g.strokeStyle = showSet === 'm' ? 'rgba(196,181,253,1)' : 'rgba(160,160,170,1)'; g.lineWidth = 2; g.beginPath(); let on = false;
      for (let i = W - 1; i < L; i += 2) { const vs = items.map(it => it.c[i]).filter(v => v != null); if (vs.length < 4) { on = false; continue; }
        const y = Y(pct(vs, 50)); if (!on) { g.moveTo(X(i), y); on = true; } else g.lineTo(X(i), y); }
      g.stroke();
    }
    if (reveal) { g.strokeStyle = '#e0a52a'; g.lineWidth = 2; g.beginPath(); let on = false;
      for (let i = 0; i < L; i++) { const v = P().self.c[i]; if (v == null) { on = false; continue; }
        if (!on) { g.moveTo(X(i), Y(v)); on = true; } else g.lineTo(X(i), Y(v)); }
      g.stroke(); }
    g.fillStyle = '#8a8f9c'; g.font = '600 10px system-ui';
    g.fillText(`${showSet === 'm' ? 'matches' : 'control'} · ${items.length} windows · median of what followed in bold`, padL, 10);

    const at = (its, h) => its.map(it => it.c[W - 1 + h] == null ? null : it.c[W - 1 + h] - it.c[W - 1]).filter(v => v != null);
    const row = h => { const m = at(P().m, h), c = at(P().ctl, h);
      return `<div class="h">+${h}m up</div><div class="t">${m.filter(v => v > 0).length}/${m.length}</div><div class="c">${c.filter(v => v > 0).length}/${c.length}</div>
              <div class="h">+${h}m 10–90</div><div class="t">${m.length >= 4 ? (pct(m, 90) - pct(m, 10)).toFixed(0) + 't' : '–'}</div><div class="c">${c.length >= 4 ? (pct(c, 90) - pct(c, 10)).toFixed(0) + 't' : '–'}</div>`; };
    document.getElementById('stat').innerHTML =
      `<div class="h"></div><div class="h" style="color:var(--ny)">matches</div><div class="h">control</div>` +
      [15, 30, 60].filter(h => h <= F).map(row).join('');
  }

  function drawGrid() {
    const items = showSet === 'm' ? P().m : P().ctl;
    document.getElementById('grid-title').textContent = showSet === 'm'
      ? `the ${items.length} most similar ${W}-minute windows in the pool — and what followed`
      : `${items.length} random windows (control) — and what followed`;
    const grid = document.getElementById('grid'); grid.innerHTML = '';
    items.forEach(it => {
      const cell = document.createElement('div'); cell.className = 'cell' + (showSet === 'ctl' ? ' ctl' : '');
      cell.innerHTML = `<div class="cap"><span><b>${it.day}</b> ${it.tod}</span><span>${it.dist != null ? 'd ' + it.dist.toFixed(3) : ''}</span></div><canvas height="120"></canvas>`;
      grid.appendChild(cell);
      drawWin(cell.querySelector('canvas'), 120, it, { col: showSet === 'm' ? '#c4b5fd' : '#a0a0aa' });
    });
  }

  function render() {
    scrub.value = pos;
    document.getElementById('pos-label').textContent = `${P().label} – ${(() => { const m = (18 * 60 + P().s + W) % 1440; return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; })()}`;
    drawMain(); drawFan(); drawGrid();
  }
  const set = i => { pos = Math.max(0, Math.min(D.positions.length - 1, i)); render(); };
  scrub.addEventListener('input', () => set(+scrub.value));
  document.getElementById('prev').addEventListener('click', () => set(pos - 1));
  document.getElementById('next').addEventListener('click', () => set(pos + 1));
  document.getElementById('reveal').addEventListener('change', e => { reveal = e.target.checked; render(); });
  document.querySelectorAll('.sh').forEach(b => b.addEventListener('click', () => { showSet = b.dataset.s; document.querySelectorAll('.sh').forEach(x => x.classList.toggle('on', x === b)); render(); }));
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
    if (e.key === 'ArrowRight') { e.preventDefault(); set(pos + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); set(pos - 1); }
    else if (e.key === 'r') { reveal = !reveal; document.getElementById('reveal').checked = reveal; render(); }
  });
  window.addEventListener('resize', render);
  render();
})();
</script>
