[project]
name = "atas-journal"
version = "0.1.0"
description = "Personal trading journal for ATAS NQ futures exports with Databento chart reconstruction"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "databento>=0.40",
    "python-dotenv>=1.0",
    "litellm>=1.50",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # Live shadow mode's market-data feed (docs/live-shadow-plan.md phase 5).
    # Market data only: journal.live.rithmic opens TICKER_PLANT explicitly and
    # never the order plant.
    "async_rithmic>=1.6",
]

[dependency-groups]
# Declared so `uv sync` stops pruning it — it was installed ad hoc and vanished
# the first time the lock was resolved from this file.
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
