<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app paint under the notch and gesture bar;
         index.css pays that back with env(safe-area-inset-*) padding. Zoom is
         left enabled on purpose — `touch-action: manipulation` already removes
         the double-tap delay, so blocking pinch would only cost accessibility. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Tints the Android status bar to the app background once installed. -->
    <meta name="theme-color" content="#0e1117" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
    <title>ATAS Journal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
